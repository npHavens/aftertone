name: Claude review

# The gate and review jobs live in commercial-breaker's claude-review-reusable.yml.
# Outside that repo, set `uses:` below to
#   npHavens/commercial-breaker/.github/workflows/claude-review-reusable.yml@main
# and keep the triggers, permissions and job-level if: matching commercial-breaker's caller.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Skips bots and non-collaborators cheaply; the called gate owns the trigger phrase.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || (github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # The called workflow's token cannot exceed these.
    permissions:
      contents: read
      pull-requests: write
    uses: npHavens/commercial-breaker/.github/workflows/claude-review-reusable.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
