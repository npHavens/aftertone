name: Claude review

# The gate and review jobs live in commercial-breaker's claude-review-reusable.yml. It is
# pinned by full commit SHA, so a change there reaches this repo only when the pin moves.
# When moving the pin, follow AGENTS.md, and compare the triggers, permissions and `if:`
# here with commercial-breaker's own caller at the new SHA.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Skips the job for comments that cannot be a request; the called gate still decides.
    if: >-
      github.event_name == 'pull_request'
      || (github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))
    # The called workflow's token cannot exceed these.
    permissions:
      contents: read
      pull-requests: write
    uses: npHavens/commercial-breaker/.github/workflows/claude-review-reusable.yml@cf89a40b761b44675dc4891d83385d312530e117 # commercial-breaker PR #20 merge
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
