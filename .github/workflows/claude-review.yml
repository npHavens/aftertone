name: Claude review

# The gate and review jobs live in commercial-breaker's claude-review-reusable.yml. It is
# pinned by full commit SHA, so a change there reaches this repo only when the pin moves.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # The called workflow's token cannot exceed these.
    permissions:
      contents: read
      pull-requests: write
    uses: npHavens/commercial-breaker/.github/workflows/claude-review-reusable.yml@f43cf9ea1d50d03e81ec772c36e648e98196986d
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
